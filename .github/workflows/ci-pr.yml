name: CI PR

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Enforce changelog
        run: ./.github/scripts/check-unreleased-changelog.sh
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make build test
      - run: make release-build tool=pgpac version=0.0.0-ci
      - run: make release-build tool=d1pac version=0.0.0-ci
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: make website-install website-typecheck website-build
